<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1020" height="1314" viewBox="0 44 680 876">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#00000040"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b3a4a"/>
    </marker>
    <marker id="arrow-data" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5e5955"/>
    </marker>
  </defs>

  <rect width="680" height="920" rx="4" fill="#16161b"/>

  <!-- STEP 1 (USER INPUT) -->
  <rect x="170" y="64" width="340" height="48" rx="24" ry="24"
        fill="#1a1a20" stroke="#8b3a4a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="340" y="85" text-anchor="middle"
        font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#c4b5ac">
    User input
  </text>
  <text x="340" y="101" text-anchor="middle"
        font-family="Consolas, monospace" font-size="10.5" fill="#7a7570">
    readline() / get_next_line()
  </text>
  <!-- ========= -->
  <line x1="340" y1="112" x2="340" y2="140" stroke="#8b3a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="348" y="131" font-family="Consolas, monospace" font-size="9.5" fill="#5e5955">char *</text>

  <!-- STEP 2 (TOKENIZER) -->
  <rect x="170" y="144" width="340" height="56" rx="6"
        fill="#1e1e24" stroke="#8b3a4a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="340" y="167" text-anchor="middle"
        font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c4b5ac">
    Tokenizer
  </text>
  <text x="340" y="185" text-anchor="middle"
        font-family="Consolas, monospace" font-size="10" fill="#7a7570">
    src/lexer/tokenizer.c
  </text>
  <!-- ========= -->
  <line x1="340" y1="200" x2="340" y2="228" stroke="#8b3a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="348" y="219" font-family="Consolas, monospace" font-size="9.5" fill="#5e5955">t_token * linked list</text>

  <!-- STEP 3 (EXPANDER) -->
  <rect x="170" y="232" width="340" height="64" rx="6"
        fill="#1e1e24" stroke="#8b3a4a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="340" y="255" text-anchor="middle"
        font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c4b5ac">
    Expander
  </text>
  <text x="340" y="272" text-anchor="middle"
        font-family="Consolas, monospace" font-size="10" fill="#7a7570">
    src/lexer/expander.c
  </text>
  <text x="340" y="286" text-anchor="middle"
        font-family="Consolas, monospace" font-size="10" fill="#7a7570">
    src/lexer/tilde_expand.c
  </text>

  <!-- ========= -->
  <line x1="340" y1="296" x2="340" y2="324" stroke="#8b3a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="348" y="316" font-family="Consolas, monospace" font-size="9.5" fill="#5e5955">t_token * (in place)</text>

  <!-- STEP 4 (PARSER) -->
  <rect x="170" y="328" width="340" height="72" rx="6"
        fill="#1e1e24" stroke="#8b3a4a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="340" y="352" text-anchor="middle"
        font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c4b5ac">
    Parser
  </text>
  <text x="340" y="370" text-anchor="middle"
        font-family="Consolas, monospace" font-size="10" fill="#7a7570">
    src/parser/parser.c
  </text>
  <text x="340" y="384" text-anchor="middle"
        font-family="Consolas, monospace" font-size="10" fill="#7a7570">
    → parser_pipeline.c, parser_redir.c
  </text>

  <!-- ========= -->
  <line x1="340" y1="400" x2="340" y2="428" stroke="#8b3a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="348" y="419" font-family="Consolas, monospace" font-size="9.5" fill="#5e5955">t_ast * tree</text>

  <!-- STEP 5 (HEREDOC PRE-COLLEC) -->
  <rect x="170" y="432" width="340" height="56" rx="6"
        fill="#1a1a20" stroke="#4a2a30" stroke-width="1.5" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <text x="340" y="455" text-anchor="middle"
        font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c4b5ac">
    Heredoc pre-collection
  </text>
  <text x="340" y="475" text-anchor="middle"
        font-family="Consolas, monospace" font-size="10" fill="#7a7570">
    src/executor/heredoc_collect.c
  </text>

  <!-- ========= -->
  <line x1="340" y1="488" x2="340" y2="516" stroke="#8b3a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="348" y="507" font-family="Consolas, monospace" font-size="9.5" fill="#5e5955">t_ast * (heredoc_fd set)</text>

  <!-- STEP 6 (EXECUTOR) -->
  <rect x="170" y="520" width="340" height="72" rx="6"
        fill="#1e1e24" stroke="#8b3a4a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="340" y="544" text-anchor="middle"
        font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c4b5ac">
    Executor
  </text>
  <text x="340" y="562" text-anchor="middle"
        font-family="Consolas, monospace" font-size="10" fill="#7a7570">
    src/executor/executor.c
  </text>
  <text x="340" y="576" text-anchor="middle"
        font-family="Consolas, monospace" font-size="10" fill="#7a7570">
    → exec_cmd.c, executor_pipe.c
  </text>

  <!-- ========= -->
  <line x1="340" y1="592" x2="340" y2="620" stroke="#8b3a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- RESULT -->
  <rect x="210" y="624" width="260" height="40" rx="20" ry="20"
        fill="#1a1a20" stroke="#8b3a4a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="340" y="649" text-anchor="middle"
        font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#c4b5ac">
    shell-&gt;exit_status
  </text>

  <!-- I Am Legend -->
  <rect x="30" y="700" width="620" height="190" rx="6"
        fill="#1a1a20" stroke="#2e2a2c" stroke-width="1"/>
  <text x="340" y="724" text-anchor="middle"
        font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#c4b5ac">
    Key data structures
  </text>

  <!-- t_token -->
  <rect x="52" y="740" width="280" height="52" rx="4" fill="#16161b" stroke="#2e2a2c" stroke-width="1"/>
  <text x="62" y="758"
        font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#8b3a4a">t_token</text>
  <text x="62" y="780"
        font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="10" fill="#7a7570">
    Doubly linked list of lexical tokens
  </text>

  <!-- t_ast -->
  <rect x="348" y="740" width="280" height="52" rx="4" fill="#16161b" stroke="#2e2a2c" stroke-width="1"/>
  <text x="358" y="758"
        font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#8b3a4a">t_ast</text>
  <text x="358" y="780"
        font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="10" fill="#7a7570">
    Union based AST node (cmd / redir / binary)
  </text>

  <!-- t_shell -->
  <rect x="52" y="804" width="280" height="52" rx="4" fill="#16161b" stroke="#2e2a2c" stroke-width="1"/>
  <text x="62" y="822"
        font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#8b3a4a">t_shell</text>
  <text x="62" y="844"
        font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="10" fill="#7a7570">
    Global shell state
  </text>

  <!-- t_env -->
  <rect x="348" y="804" width="280" height="52" rx="4" fill="#16161b" stroke="#2e2a2c" stroke-width="1"/>
  <text x="358" y="822"
        font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#8b3a4a">t_env</text>
  <text x="358" y="844"
        font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="10" fill="#7a7570">
    Doubly linked list of KEY=VALUE couples
  </text>

  <!-- Dashed border note -->
  <line x1="52" y1="878" x2="92" y2="878" stroke="#4a2a30" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="100" y="882"
        font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="10" fill="#5e5955">
    pre-processing (mutates existing tree and no new allocation)
  </text>
</svg>
